---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.date %}
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%d de %B de %Y" }}
        </time>
        {% endif %}
        {% if page.author %}
        <p class="post-author">Por {{ page.author }}</p>
        {% endif %}
    </header>
    
    <div class="post-content">
        {{ content }}
    </div>
</article>
